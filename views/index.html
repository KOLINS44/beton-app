<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/public/manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/public/styles.css">
    <title>Новая заявка на бетон</title>
</head>
<body class="container py-4">
    <h1 class="mb-4">Новая заявка</h1>
    <form action="/submit" method="POST" class="row g-3">
        <div class="col-md-6">
            <label class="form-label" for="name">Имя</label>
            <input class="form-control" type="text" id="name" name="name" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="phone">Телефон</label>
            <input class="form-control" type="tel" id="phone" name="phone" required>
        </div>
        <div class="col-12">
            <label class="form-label" for="address">Адрес</label>
            <input class="form-control" type="text" id="address" name="address" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="grade">Марка бетона</label>
            <input class="form-control" type="text" id="grade" name="grade" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="volume">Объём (м³)</label>
            <input class="form-control" type="number" step="0.1" id="volume" name="volume" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="date">Дата</label>
            <input class="form-control" type="date" id="date" name="date" required>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Отправить</button>
        </div>
    </form>
    <a href="/zayavki" class="btn btn-link mt-3">Посмотреть все заявки</a>
    <script src="/public/app.js"></script>
</body>
</html>
